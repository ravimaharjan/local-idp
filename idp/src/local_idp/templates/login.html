<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#d0d5dd; --brand:#2f5be7; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2030; --text:#e8ebf2; --muted:#98a2b3; --line:#38405a; --brand:#7a9bff; --err:#ff8b80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { width:min(24rem, calc(100vw - 2rem)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.5rem; }
  p.sub { margin:0 0 1.5rem; color:var(--muted); font-size:.9rem; }
  label { display:block; margin:0 0 1rem; font-size:.875rem; font-weight:600; }
  input[type=email], input[type=password] { display:block; width:100%; margin-top:.35rem; padding:.6rem .7rem; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; }
  button { width:100%; padding:.7rem; font:inherit; font-weight:600; color:#fff; background:var(--brand); border:0; border-radius:8px; cursor:pointer; }
  .error { margin:0 0 1rem; color:var(--err); font-size:.9rem; }
  footer { margin-top:1.25rem; text-align:center; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p class="sub">to continue to {{ app_name }}</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/authorize">
    {% for name, value in hidden.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <label>Email <input type="email" name="email" autocomplete="username" autofocus required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <footer>Local IdP</footer>
</main>
</body>
</html>
