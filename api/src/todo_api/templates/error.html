{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
  <h1>Something went wrong</h1>
  <p class="error" role="alert">{{ message }}</p>
  <a class="button" href="{{ '/login' if retry else '/' }}">{{ 'Try signing in again' if retry else 'Back' }}</a>
{% endblock %}
