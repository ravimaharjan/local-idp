[project]
name = "todo-api"
version = "0.1.0"
description = "Todo API protected by the local OAuth2 identity provider (local-idp)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "todo_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
